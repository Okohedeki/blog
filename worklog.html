<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent work archive — Edeki Okoh</title>
  <meta name="description" content="A dated archive of work with coding agents, with sanitized summaries and observed usage.">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <main>
    <header class="intro prose">
      <p><a href="./">← Edeki Okoh</a></p>
      <h1>Agent work archive.</h1>
      <p class="lede">Retained work with coding agents, grouped by date. These historical records show observed activity and usage, not product benchmarks.</p>
    </header>
    <section class="work" aria-labelledby="work-title">
      <div class="section-heading">
        <h2 id="work-title">Recorded sessions</h2>
        <span>Newest first.</span>
      </div>
      <div class="worklog-days" id="worklog-days" aria-live="polite">
        <p class="worklog-loading">Loading dates…</p>
      </div>
      <noscript><p>JavaScript is required for the interactive archive.</p></noscript>
    </section>
  </main>
  <footer>© 2026 — Edeki Okoh.</footer>
  <script src="./worklog/agent-graph.js"></script>
